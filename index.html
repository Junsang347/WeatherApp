<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-card">
        <h1>Weather App</h1>

        <div class="search-section">
            <input type="text" id="cityInput" placeholder="Enter city name" spellcheck="false">
            <button id="searchBtn">Search</button>
        </div>

        <div class="error" id="errorMsg">City not found</div>

        <div id="weatherInfo">
            <h2 id="cityName">--</h2>
            <h3 id="date">--</h3>
            <img id="weatherIcon" src="" alt="Weather Icon">
            <p id="tempText">--°C</p>
            <p id="descText">--</p>
            <p id="condtition">--</p>
        </div>

        <div class="extra-info">
            <p>Humidity: <span id="humidityText">--</span>%</p>
            <p>Wind Speed: <span id="windText">--</span> km/h</p>
            <p>Wind Direction: <span id="windDirText">--</span>°</p>
            <p>Pressure: <span id="pressureText">--</span> hPa</p>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
